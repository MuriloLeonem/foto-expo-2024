<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Te amo boss 💛</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0a0a0f; color: #f4f4f5; min-height: 100vh; overflow-x: hidden; }

    .overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.8); backdrop-filter: blur(8px); padding: 1.5rem; transition: opacity .4s, visibility .4s; }
    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .modal { background: linear-gradient(145deg,#1a1a24,#12121a); border: 1px solid #3f3f55; border-radius: 20px; padding: 2rem 2.25rem; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 24px 64px rgba(0,0,0,.6); }
    .modal h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: .5rem; }
    .modal p { font-size: .95rem; color: #a1a1aa; margin-bottom: 1.75rem; line-height: 1.5; }
    .actions { display: flex; gap: .75rem; justify-content: center; }
    button { cursor: pointer; border: none; border-radius: 10px; font-size: .95rem; font-weight: 600; padding: .65rem 1.5rem; transition: transform .15s; }
    button:active { transform: scale(.97); }
    .btn-yes { background: linear-gradient(135deg,#ec4899,#f43f5e); color: #fff; }
    .btn-no { background: #27272f; color: #d4d4d8; border: 1px solid #3f3f48; }

    .content { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; opacity: 0; transition: opacity .6s; }
    .content.visible { display: flex; opacity: 1; }

    .stage {
      position: relative;
      max-width: min(900px, 96vw);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(236,72,153,.25), 0 8px 32px rgba(0,0,0,.5);
    }

    .stage img.photo {
      display: block;
      width: 100%;
      max-height: 80vh;
      object-fit: cover;
    }

    .tribute {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8%;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(to top, rgba(0,0,0,.55) 0%, transparent 45%);
    }

    .tribute span {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: lowercase;
      color: #fff;
      text-shadow: 0 2px 20px rgba(236,72,153,.8), 0 4px 40px rgba(0,0,0,.6);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: .92; }
    }

    .flyers {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .fly {
      position: absolute;
      opacity: .85;
      filter: drop-shadow(0 4px 12px rgba(255,255,255,.3));
    }

    .fly-1 { width: 120px; top: 15%; animation: fly-right 14s linear infinite; }
    .fly-2 { width: 90px; top: 45%; animation: fly-left 18s linear infinite; animation-delay: -4s; }
    .fly-3 { width: 110px; top: 70%; animation: fly-right 16s linear infinite; animation-delay: -8s; }
    .fly-4 { width: 80px; top: 28%; animation: fly-left 20s linear infinite; animation-delay: -2s; }
    .fly-5 { width: 100px; top: 55%; animation: fly-right 22s linear infinite; animation-delay: -11s; }
    .fly-6 { width: 70px; top: 8%; animation: fly-left 15s linear infinite; animation-delay: -6s; }

    @keyframes fly-right {
      from { left: -140px; transform: translateY(0) rotate(-5deg); }
      25% { transform: translateY(-12px) rotate(3deg); }
      50% { transform: translateY(8px) rotate(-2deg); }
      75% { transform: translateY(-6px) rotate(4deg); }
      to { left: calc(100% + 140px); transform: translateY(0) rotate(-5deg); }
    }

    @keyframes fly-left {
      from { right: -140px; left: auto; transform: translateY(0) scaleX(-1) rotate(-5deg); }
      25% { transform: translateY(10px) scaleX(-1) rotate(3deg); }
      50% { transform: translateY(-8px) scaleX(-1) rotate(-2deg); }
      75% { transform: translateY(6px) scaleX(-1) rotate(4deg); }
      to { right: calc(100% + 140px); left: auto; transform: translateY(0) scaleX(-1) rotate(-5deg); }
    }

    .caption { margin-top: 1.25rem; font-size: .9rem; color: #71717a; font-style: italic; }
    .declined { display: none; min-height: 100vh; align-items: center; justify-content: center; color: #71717a; }
    .declined.visible { display: flex; }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>Tem certeza que deseja abrir?</h2>
      <p>Uma homenagem especial está te esperando. Deseja continuar?</p>
      <div class="actions">
        <button class="btn-yes" id="btn-yes">Sim 💛</button>
        <button class="btn-no" id="btn-no">Não</button>
      </div>
    </div>
  </div>

  <main class="content" id="content">
    <div class="stage">
      <img class="photo" id="foto" alt="Homenagem" />
      <div class="tribute"><span>te amo boss</span></div>
      <div class="flyers">
        <img class="fly fly-1" src="https://fotos.web.sapo.io/i/oaa0499ca/5611379_T0SZz.gif" alt="" />
        <img class="fly fly-2" src="https://i.pinimg.com/originals/f6/d7/50/f6d750ea3e927d9c4a213eb17ad79bbb.gif" alt="" />
        <img class="fly fly-3" src="https://fotos.web.sapo.io/i/oaa0499ca/5611379_T0SZz.gif" alt="" />
        <img class="fly fly-4" src="https://i.pinimg.com/originals/f6/d7/50/f6d750ea3e927d9c4a213eb17ad79bbb.gif" alt="" />
        <img class="fly fly-5" src="https://fotos.web.sapo.io/i/oaa0499ca/5611379_T0SZz.gif" alt="" />
        <img class="fly fly-6" src="https://i.pinimg.com/originals/f6/d7/50/f6d750ea3e927d9c4a213eb17ad79bbb.gif" alt="" />
      </div>
    </div>
    <p class="caption">com carinho ✨</p>
  </main>

  <div class="declined" id="declined"><p>Ok, fica para a próxima 💛</p></div>
